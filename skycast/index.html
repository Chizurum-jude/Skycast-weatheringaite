
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast | Weather App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #10182e, #075985);
    }

    .app {
      max-width: 600px;
      margin: 30px auto;
      padding: 28px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #101827cc;
      box-shadow: 0 15px 50px #0003;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #b9c7dc;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #40516d;
      border-radius: 10px;
      background: #18243a;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082032;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .weather {
      display: none;
    }

    .main-weather {
      text-align: center;
      padding: 22px 0;
    }

    #icon {
      font-size: 72px;
    }

    #temperature {
      font-size: 64px;
      font-weight: bold;
      margin: 8px 0;
    }

    #description {
      font-size: 20px;
      color: #cbd5e1;
    }

    #cityName {
      font-size: 25px;
      font-weight: bold;
      margin-top: 12px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0 25px;
    }

    .detail, .day {
      padding: 17px;
      border-radius: 14px;
      background: #ffffff0d;
      border: 1px solid #ffffff12;
    }

    .detail span {
      display: block;
      margin-top: 9px;
      color: #dbeafe;
      font-size: 19px;
      font-weight: bold;
    }

    h2 {
      font-size: 20px;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .day {
      text-align: center;
      padding: 12px 5px;
      font-size: 13px;
    }

    .day-icon {
      font-size: 24px;
      margin: 12px 0;
    }

    .day-temp {
      font-weight: bold;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #aabbd2;
      font-size: 12px;
    }

    footer a {
      color: #7dd3fc;
    }

    @media (max-width: 420px) {
      .app {
        padding: 20px 14px;
      }

      h1 {
        font-size: 27px;
      }

      form {
        flex-direction: column;
      }

      .forecast {
        gap: 5px;
      }

      .day {
        padding: 10px 2px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>🌤️ SkyCast</h1>
    <p class="subtitle">Simple weather. Wherever you are.</p>

    <form id="searchForm">
      <input
        id="cityInput"
        type="text"
        placeholder="Enter a city, e.g. Lagos"
        value="Lagos"
        required
      >
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status">Loading weather...</p>

    <section id="weather" class="weather">
      <div class="main-weather">
        <div id="icon">🌤️</div>
        <div id="temperature">--°C</div>
        <div id="description">Weather</div>
        <div id="cityName">City</div>
        <p id="localTime"></p>
      </div>

      <div class="details">
        <div class="detail">
          Feels like
          <span id="feelsLike">--°C</span>
        </div>
        <div class="detail">
          Humidity
          <span id="humidity">--%</span>
        </div>
        <div class="detail">
          Wind speed
          <span id="wind">-- km/h</span>
        </div>
        <div class="detail">
          Today's high / low
          <span id="highLow">--° / --°</span>
        </div>
      </div>

      <h2>5-Day Forecast</h2>
      <div id="forecast" class="forecast"></div>
    </section>

    <footer>
      Weather data provided by
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">
        Open-Meteo
      </a>
    </footer>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const statusText = document.getElementById("status");
    const weatherSection = document.getElementById("weather");

    function weatherInfo(code) {
      if (code === 0) return ["☀️", "Clear sky"];
      if (code === 1) return ["🌤️", "Mainly clear"];
      if (code === 2) return ["⛅", "Partly cloudy"];
      if (code === 3) return ["☁️", "Overcast"];
      if ([45, 48].includes(code)) return ["🌫️", "Foggy"];
      if ([51, 53, 55, 56, 57].includes(code))
        return ["🌦️", "Drizzle"];
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code))
        return ["🌧️", "Rainy"];
      if ([71, 73, 75, 77, 85, 86].includes(code))
        return ["❄️", "Snow"];
      if ([95, 96, 99].includes(code))
        return ["⛈️", "Thunderstorm"];

      return ["🌡️", "Weather conditions"];
    }

    function showError(message) {
      statusText.textContent = message;
      weatherSection.style.display = "none";
    }

    async function loadWeather(city) {
      statusText.textContent = "Searching for " + city + "...";
      weatherSection.style.display = "none";

      try {
        const geoUrl =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(city) +
          "&count=1&language=en&format=json";

        const geoResponse = await fetch(geoUrl);

        if (!geoResponse.ok) {
          throw new Error("Could not contact the city search service.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("City not found. Check the spelling and try again.");
        }

        const place = geoData.results[0];

        const params = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: [
            "temperature_2m",
            "relative_humidity_2m",
            "apparent_temperature",
            "weather_code",
            "wind_speed_10m"
          ].join(","),
          daily: [
            "weather_code",
            "temperature_2m_max",
            "temperature_2m_min"
          ].join(","),
          forecast_days: "5",
          timezone: "auto"
        });

        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
          throw new Error("Could not retrieve weather data.");
        }

        const data = await response.json();
        const current = data.current;
        const daily = data.daily;
        const info = weatherInfo(current.weather_code);

        document.getElementById("icon").textContent = info[0];
        document.getElementById("temperature").textContent =
          Math.round(current.temperature_2m) + "°C";

        document.getElementById("description").textContent = info[1];

        document.getElementById("cityName").textContent =
          place.name +
          (place.admin1 ? ", " + place.admin1 : "") +
          (place.country ? ", " + place.country : "");

        document.getElementById("feelsLike").textContent =
          Math.round(current.apparent_temperature) + "°C";

        document.getElementById("humidity").textContent =
          current.relative_humidity_2m + "%";

        document.getElementById("wind").textContent =
          Math.round(current.wind_speed_10m) + " km/h";

        document.getElementById("highLow").textContent =
          Math.round(daily.temperature_2m_max[0]) + "° / " +
          Math.round(daily.temperature_2m_min[0]) + "°";

        document.getElementById("localTime").textContent =
          "Local time: " + current.time.replace("T", " ");

        const forecast = document.getElementById("forecast");
        forecast.innerHTML = "";

        for (let i = 0; i < daily.time.length; i++) {
          const date = new Date(daily.time[i] + "T12:00:00");
          const dayName = i === 0
            ? "Today"
            : date.toLocaleDateString("en", { weekday: "short" });

          const dayInfo = weatherInfo(daily.weather_code[i]);
          const card = document.createElement("div");
          card.className = "day";

          const name = document.createElement("div");
          name.textContent = dayName;

          const icon = document.createElement("div");
          icon.className = "day-icon";
          icon.textContent = dayInfo[0];
          icon.title = dayInfo[1];

          const temp = document.createElement("div");
          temp.className = "day-temp";
          temp.textContent =
            Math.round(daily.temperature_2m_max[i]) + "°";

          const low = document.createElement("div");
          low.textContent =
            Math.round(daily.temperature_2m_min[i]) + "°";

          card.append(name, icon, temp, low);
          forecast.appendChild(card);
        }

        weatherSection.style.display = "block";
        statusText.textContent = "Weather loaded successfully.";

      } catch (error) {
        console.error("SkyCast error:", error);

        showError(
          error instanceof TypeError
            ? "Network error. Check your internet connection and try again."
            : error.message
        );
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const city = cityInput.value.trim();

      if (city) {
        loadWeather(city);
      }
    });

    loadWeather("Lagos");
  </script>
</body>
</html>
